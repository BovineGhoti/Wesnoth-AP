
[modification]
    id=campaign_randomizer_mod
    name=_ "Campaign Randomizer"
    description=_ "An SP modification designed to add a healthy dose of chaos to Wesnoth campaigns. WARNING: This mod is not balanced and may cause issues with many campaigns. Use at your own risk."

# Toggles
# =======

    [options]
        [checkbox]
            id=opt_enable_random_recruits
            default=yes
            name=_ "Randomized Recruit List"
            description=_ "Your recruit list will be randomized. You will gain additional recruits at the start of each scenario."
        [/checkbox]
        [checkbox]
            id=opt_enable_gold_boost
            default=yes
            name=_ "Random Gold Boosts"
            description=_ "Teams may randomly gain 50 gold."
        [/checkbox]
        [checkbox]
            id=opt_enable_loyal_reinforcement
            default=yes
            name=_ "Random Reinforcements"
            description=_ "Allows free loyal units to spawn."
        [/checkbox]
        [checkbox]
            id=opt_enable_status_effect
            default=yes
            name=_ "Random Status Effects"
            description=_ "Allows random poisoning and slowing."
        [/checkbox]
        [checkbox]
            id=opt_enable_random_xp
            default=yes
            name=_ "Random Experience Gains"
            description=_ "Allows 1 to 25 bonus XP to be awarded to a random unit."
        [/checkbox]
        [checkbox]
            id=opt_enable_terrain_scramble
            default=yes
            name=_ "Random Terrain Scramble"
            description=_ "Allows random events to completely warp the landscape within 2 tiles of a random unit (structures are protected)."
        [/checkbox]
	[checkbox]
            id=opt_enable_event_messages
            default=yes
            name=_ "Show Event Messages"
            description=_ "Display narrator popup messages when random chaos events occur."
        [/checkbox]
	[choice]
            id=opt_event_frequency
            default="player_turn"
            name=_ "Event Frequency"
            description=_ "Choose when chaos events occur, or disable chaos events entirely."
            [item]
                value="player_turn"
                name=_ "Once on Each Player Turn"
            [/item]
            [item]
                value="every_side"
                name=_ "Once on Every Side Turn"
            [/item]
            [item]
                value="disabled"
                name=_ "Disabled (No Chaos Events)"
            [/item]
        [/choice]
    [/options]

# Random Recruits
# ===============

#define PULL_UNIQUE_RANDOM_UNIT SIDE_NUMBER
    [clear_variable]
        name=chosen_unit,is_duplicate,attempts
    [/clear_variable]
    [set_variable]
        name=is_duplicate
        value=yes
    [/set_variable]
    [set_variable]
        name=attempts
        value=0
    [/set_variable]
    [store_side]
        side={SIDE_NUMBER}
        variable=target_side_data
    [/store_side]
    [while]
        [variable]
            name=is_duplicate
            equals=yes
        [/variable]
        [and]
            [variable]
                name=attempts
                less_than=20
            [/variable]
        [/and]
        [do]
            [set_variable]
                name=attempts
                add=1
            [/set_variable]
            [set_variable]
                name=random_index
                rand=0..$($unit_pool_array.length - 1)
            [/set_variable]
            [set_variable]
                name=temp_unit
                value=$unit_pool_array[$random_index].value
            [/set_variable]
            [if]
                [variable]
                    name=target_side_data[0].recruit
                    contains=$temp_unit
                [/variable]
                [then]
                    [set_variable]
                        name=is_duplicate
                        value=yes
                    [/set_variable]
                [/then]
                [else]
                    [set_variable]
                        name=is_duplicate
                        value=no
                    [/set_variable]
                    [set_variable]
                        name=chosen_unit
                        value=$temp_unit
                    [/set_variable]
                [/else]
            [/if]
        [/do]
    [/while]
    [clear_variable]
        name=target_side_data,temp_unit,random_index,is_duplicate,attempts
    [/clear_variable]
#enddef

# New scenario adds to recruit pool
# ===============================

[event]
    name=turn 1
    first_time_only=yes
    [if]
        [variable]
            name=opt_enable_random_recruits
            boolean_equals=yes
        [/variable]
        [then]
            [if]
                [variable]
                    name=unit_pool_array.length
                    less_than=1
                [/variable]
                [then]
                    [set_variables]
                        name=unit_pool_array
                        [split]
                            list="Peasant,Bowman,Fencer,Heavy Infantryman,Mage,Merman Fighter,Merman Citizen,Ruffian,Spearman,Cavalryman,Elvish Archer,Elvish Fighter,Elvish Scout,Elvish Shaman,Wose,Merman Hunter,Goblin Spearman,Goblin Rouser,Orcish Archer,Orcish Assassin,Orcish Grunt,Troll Whelp,Naga Fighter,Ghost,Ghoul,Skeleton,Skeleton Archer,Walking Corpse,Soulless,Dwarvish Fighter,Dwarvish Guardsman,Dwarvish Scout,Dwarvish Thunderer,Thief,Poacher,Footpad,Gryphon Rider,Drake Clasher,Drake Glider,Drake Burner,Drake Fighter,Saurian Augur,Saurian Skirmisher,Dune Burner,Dune Herbalist,Dune Rover,Dune Rider,Dune Soldier,Dune Skirmisher,Mudcrawler,Giant Rat,Vampire Bat"
                            key=value
                            separator=","
                        [/split]
                    [/set_variables]
                [/then]
            [/if]
            {PULL_UNIQUE_RANDOM_UNIT 1}
            [if]
                [variable]
                    name=chosen_unit
                    not_equals=""
                [/variable]
                [then]
                    [allow_recruit]
                        side=1
                        type=$chosen_unit
                    [/allow_recruit]
                    [if]
                        [variable]
                            name=random_recruits_cache
                            equals=""
                        [/variable]
                        [then]
                            [set_variable]
                                name=random_recruits_cache
                                value=$chosen_unit
                            [/set_variable]
                        [/then]
                        [else]
                            [set_variable]
                                name=random_recruits_cache
                                value="$random_recruits_cache,$chosen_unit"
                            [/set_variable]
                        [/else]
                    [/if]
                    [if]
                        [variable]
                            name=opt_enable_event_messages
                            boolean_equals=yes
                        [/variable]
                        [then]
                            [message]
                                speaker=narrator
                                image="wesnoth-icon.png"
                                message= _ "A group of mercenaries joins your cause! You may now recruit: $chosen_unit"
                            [/message]
                        [/then]
                    [/if]
                [/then]
            [/if]
        [/then]
    [/if]
[/event]

#define CR_CORE_PERSISTENT_RECRUITMENT
    [if]
        [variable]
            name=opt_enable_random_recruits
            boolean_equals=yes
        [/variable]
        [or]
            [variable]
                name=random_recruits_cache
                equals=""
            [/variable]
        [/or]
        [then]
            [store_side]
                variable=all_scenario_sides
            [/store_side]
            [foreach]
                array=all_scenario_sides
                [do]
                    [if]
                        [variable]
                            name=this_item.controller
                            equals=human
                        [/variable]
                        [then]
                            [set_variable]
                                name=human_side_number
                                value=$this_item.side
                            [/set_variable]
                            [set_recruit]
                                side=$human_side_number
                                recruit=""
                            [/set_recruit]
                            [if]
                                [variable]
                                    name=random_recruits_cache
                                    equals=""
                                [/variable]
                                [then]
                                    [set_variable]
                                        name=notification_text
                                        value=""
                                    [/set_variable]
                                    [set_variable]
                                        name=loop_counter
                                        value=0
                                    [/set_variable]
                                    [while]
                                        [variable]
                                            name=loop_counter
                                            less_than=2
                                        [/variable]
                                        [do]
                                            {PULL_UNIQUE_RANDOM_UNIT $human_side_number}
                                            [if]
                                                [variable]
                                                    name=chosen_unit
                                                    not_equals=""
                                                [/variable]
                                                [then]
                                                    [allow_recruit]
                                                        side=$human_side_number
                                                        type=$chosen_unit
                                                    [/allow_recruit]
                                                    [set_variable]
                                                        name=notification_text
                                                        value="$notification_text• $chosen_unit "
                                                    [/set_variable]
                                                    [if]
                                                        [variable]
                                                            name=random_recruits_cache
                                                            equals=""
                                                        [/variable]
                                                        [then]
                                                            [set_variable]
                                                                name=random_recruits_cache
                                                                value=$chosen_unit
                                                            [/set_variable]
                                                        [/then]
                                                        [else]
                                                            [set_variable]
                                                                name=random_recruits_cache
                                                                value="$random_recruits_cache,$chosen_unit"
                                                            [/set_variable]
                                                        [/else]
                                                    [/if]
                                                [/then]
                                            [/if]
                                            [set_variable]
                                                name=loop_counter
                                                add=1
                                            [/set_variable]
                                        [/do]
                                    [/while]
                                    [message]
                                        speaker=narrator
                                        image="wesnoth-icon.png"
                                        caption=_ "Randomized Recruitment"
                                        message= _ "A ragtag group answers your call to arms. You can now recruit: $notification_text"
                                    [/message]
                                [/then]
                                [else]
                                    [set_recruit]
                                        side=$human_side_number
                                        recruit=$random_recruits_cache
                                    [/set_recruit]
                                [/else]
                            [/if]
                        [/then]
                    [/if]
                [/do]
            [/foreach]
            [clear_variable]
                name=all_scenario_sides,loop_counter,chosen_unit,notification_text
            [/clear_variable]
        [/then]
    [/if]
#enddef

# Initialization events
# ==================

[event]
    name=prestart
    first_time_only=no
    [if]
        [variable]
            name=unit_pool_initialized
            boolean_equals=no
        [/variable]
        [then]
            [set_variables]
                name=unit_pool_array
                [split]
                    list="Peasant,Bowman,Fencer,Heavy Infantryman,Mage,Merman Fighter,Merman Citizen,Ruffian,Spearman,Cavalryman,Elvish Archer,Elvish Fighter,Elvish Scout,Elvish Shaman,Wose,Merman Hunter,Goblin Spearman,Goblin Rouser,Orcish Archer,Orcish Assassin,Orcish Grunt,Troll Whelp,Naga Fighter,Ghost,Ghoul,Skeleton,Skeleton Archer,Walking Corpse,Soulless,Dwarvish Fighter,Dwarvish Guardsman,Dwarvish Scout,Dwarvish Thunderer,Thief,Poacher,Footpad,Gryphon Rider,Drake Clasher,Drake Glider,Drake Burner,Drake Fighter,Saurian Augur,Saurian Skirmisher,Dune Burner,Dune Herbalist,Dune Rover,Dune Soldier,Dune Skirmisher,Dune Rider,Mudcrawler,Giant Rat,Vampire Bat"
                    key=value
                    separator=","
                [/split]
            [/set_variables]
            [set_variable]
                name=unit_pool_initialized
                value=yes
            [/set_variable]
        [/then]
    [/if]
    [store_side]
        controller=human
        variable=human_sides
    [/store_side]
    [if]
        [variable]
            name=human_sides.length
            greater_than=0
        [/variable]
        [then]
            [set_variable]
                name=human_side_number
                value=$human_sides[0].side
            [/set_variable]
        [/then]
    [/if]
    [clear_variable]
        name=human_sides
    [/clear_variable]
[/event]

[event]
    name=start
    first_time_only=no
    {CR_CORE_PERSISTENT_RECRUITMENT}
[/event]

# HOW MUCH CHAOS
# ===================

[event]
    name=side_turn
    first_time_only=no

    [store_side]
        side=$side_number
        variable=current_active_side
    [/store_side]

    # Evaluate execution based on frequency option
    [set_variable]
        name=should_run_event
        value=no
    [/set_variable]

    [if]
        [variable]
            name=opt_event_frequency
            equals="disabled"
        [/variable]
        [then]
            # Chaos events disabled; do nothing
            [set_variable]
                name=should_run_event
                value=no
            [/set_variable]
        [/then]
        [else]
            [if]
                [variable]
                    name=opt_event_frequency
                    equals="every_side"
                [/variable]
                [then]
                    [set_variable]
                        name=should_run_event
                        value=yes
                    [/set_variable]
                [/then]
                [else]
                    [if]
                        [variable]
                            name=current_active_side[0].controller
                            equals=human
                        [/variable]
                        [then]
                            [set_variable]
                                name=should_run_event
                                value=yes
                            [/set_variable]
                        [/then]
                    [/if]
                [/else]
            [/if]
        [/else]
    [/if]

    [if]
        [variable]
            name=should_run_event
            boolean_equals=yes
        [/variable]
        [then]
            [if]
                [variable]
                    name=current_active_side[0].controller
                    equals=human
                [/variable]
                [then]
                    [set_variable]
                        name=human_side_number
                        value=$side_number
                    [/set_variable]
                [/then]
            [/if]

            [clear_variable]
                name=local_choice_pool
            [/clear_variable]

# Building random event pool from toggles
# ====================================

            [if]
                [variable]
                    name=opt_enable_gold_boost
                    boolean_equals=yes
                [/variable]
                [then]
                    [set_variables]
                        name=local_choice_pool
                        mode=append
                        [value]
                            id=1
                        [/value]
                    [/set_variables]
                [/then]
            [/if]
            [if]
                [variable]
                    name=opt_enable_loyal_reinforcement
                    boolean_equals=yes
                [/variable]
                [then]
                    [set_variables]
                        name=local_choice_pool
                        mode=append
                        [value]
                            id=2
                        [/value]
                    [/set_variables]
                [/then]
            [/if]
            [if]
                [variable]
                    name=opt_enable_status_effect
                    boolean_equals=yes
                [/variable]
                [then]
                    [set_variables]
                        name=local_choice_pool
                        mode=append
                        [value]
                            id=3
                        [/value]
                    [/set_variables]
                [/then]
            [/if]
            [if]
                [variable]
                    name=opt_enable_random_xp
                    boolean_equals=yes
                [/variable]
                [then]
                    [set_variables]
                        name=local_choice_pool
                        mode=append
                        [value]
                            id=4
                        [/value]
                    [/set_variables]
                [/then]
            [/if]
            [if]
                [variable]
                    name=opt_enable_terrain_scramble
                    boolean_equals=yes
                [/variable]
                [then]
                    [set_variables]
                        name=local_choice_pool
                        mode=append
                        [value]
                            id=5
                        [/value]
                    [/set_variables]
                [/then]
            [/if]
            [if]
                [variable]
                    name=local_choice_pool.length
                    greater_than=0
                [/variable]
                [then]
                    [set_variable]
                        name=rolled_index
                        rand=0..$($local_choice_pool.length - 1)
                    [/set_variable]
                    [set_variable]
                        name=selected_macro_id
                        value=$local_choice_pool[$rolled_index].id
                    [/set_variable]
                    [switch]
                        variable=selected_macro_id

# Random event - Gold Boost
# ========================

                        [case]
                            value="1"
                            [store_unit]
                                [filter]
                                    canrecruit=yes
                                [/filter]
                                variable=all_battlefield_leaders
                            [/store_unit]
                            [if]
                                [variable]
                                    name=all_battlefield_leaders.length
                                    greater_than=0
                                [/variable]
                                [then]
                                    [set_variable]
                                        name=random_leader_idx
                                        rand=0..$($all_battlefield_leaders.length - 1)
                                    [/set_variable]
                                    [set_variable]
                                        name=lucky_side_number
                                        value=$all_battlefield_leaders[$random_leader_idx].side
                                    [/set_variable]
                                    [gold]
                                        side=$lucky_side_number
                                        amount=25
                                    [/gold]
                                    [if]
                                        [variable]
                                            name=opt_enable_event_messages
                                            boolean_equals=yes
                                        [/variable]
                                        [then]
                                            [message]
                                                speaker=narrator
                                                message= _ "Side $lucky_side_number has mysteriously acquired some gold! (+25 Gold)"
                                            [/message]
                                        [/then]
                                    [/if]
                                [/then]
                            [/if]
                            [clear_variable]
                                name=all_battlefield_leaders,random_leader_idx,lucky_side_number
                            [/clear_variable]
                        [/case]

# Random event - Ally
# ==================

                        [case]
                            value="2"
                            [store_unit]
                                [filter]
                                    canrecruit=yes
                                [/filter]
                                variable=all_battlefield_leaders
                            [/store_unit]
                            [if]
                                [variable]
                                    name=all_battlefield_leaders.length
                                    greater_than=0
                                [/variable]
                                [then]
                                    [set_variable]
                                        name=random_leader_idx
                                        rand=0..$($all_battlefield_leaders.length - 1)
                                    [/set_variable]
                                    [set_variable]
                                        name=random_unit_idx
                                        rand=0..$($unit_pool_array.length - 1)
                                    [/set_variable]
                                    [set_variable]
                                        name=spawned_unit_type
                                        value=$unit_pool_array[$random_unit_idx].value
                                    [/set_variable]
                                    [unit]
                                        side=$all_battlefield_leaders[$random_leader_idx].side
                                        type=$spawned_unit_type
                                        x,y=$all_battlefield_leaders[$random_leader_idx].x,$all_battlefield_leaders[$random_leader_idx].y
                                        animate=yes
                                        search_spaces=yes
                                        [modifications]
                                            {TRAIT_LOYAL}
                                        [/modifications]
                                    [/unit]
                                    [if]
                                        [variable]
                                            name=opt_enable_event_messages
                                            boolean_equals=yes
                                        [/variable]
                                        [then]
                                            [message]
                                                speaker=narrator
                                                image="wesnoth-icon.png"
                                                message= _ "Unexpected Allies! A loyal $spawned_unit_type has arrived to reinforce Side $all_battlefield_leaders[$random_leader_idx].side!"
                                            [/message]
                                        [/then]
                                    [/if]
                                [/then]
                            [/if]
                            [clear_variable]
                                name=all_battlefield_leaders,random_leader_idx,random_unit_idx,spawned_unit_type
                            [/clear_variable]
                        [/case]


# Random event - Status effect
# ============================

                        [case]
                            value="3"
                            [store_unit]
                                [filter]
                                    canrecruit=no
                                [/filter]
                                variable=all_eligible_units
                            [/store_unit]
                            [if]
                                [variable]
                                    name=all_eligible_units.length
                                    greater_than=0
                                [/variable]
                                [then]
                                    [set_variable]
                                        name=target_unit_idx
                                        rand=0..$($all_eligible_units.length - 1)
                                    [/set_variable]
                                    [set_variable]
                                        name=status_roll
                                        rand=1..2
                                    [/set_variable]
                                    [if]
                                        [variable]
                                            name=status_roll
                                            equals=1
                                        [/variable]
                                        [then]
                                            [modify_unit]
                                                [filter]
                                                    id=$all_eligible_units[$target_unit_idx].id
                                                [/filter]
                                                [status]
                                                    poisoned=yes
                                                [/status]
                                            [/modify_unit]
                                            [if]
                                                [variable]
                                                    name=opt_enable_event_messages
                                                    boolean_equals=yes
                                                [/variable]
                                                [then]
                                                    [message]
                                                        speaker=narrator
                                                        message= _ "$all_eligible_units[$target_unit_idx].name has acquired dysentery! Stop drinking contaminated water! (unit poisoned)"
                                                    [/message]
                                                [/then]
                                            [/if]
                                        [/then]
                                        [else]
                                            [modify_unit]
                                                [filter]
                                                    id=$all_eligible_units[$target_unit_idx].id
                                                [/filter]
                                                [status]
                                                    slowed=yes
                                                [/status]
                                            [/modify_unit]
                                            [if]
                                                [variable]
                                                    name=opt_enable_event_messages
                                                    boolean_equals=yes
                                                [/variable]
                                                [then]
                                                    [message]
                                                        speaker=narrator
                                                        message= _ "$all_eligible_units[$target_unit_idx].name is out of breath. They should try doing more cardio! (unit slowed)"
                                                    [/message]
                                                [/then]
                                            [/if]
                                        [/else]
                                    [/if]
                                [/then]
                            [/if]
                            [clear_variable]
                                name=all_eligible_units,target_unit_idx,status_roll
                            [/clear_variable]
                        [/case]

# Random event - Bonus XP
# =======================

                        [case]
                            value="4"
                            [store_unit]
                                [filter]
                                [/filter]
                                variable=all_eligible_units
                            [/store_unit]
                            [if]
                                [variable]
                                    name=all_eligible_units.length
                                    greater_than=0
                                [/variable]
                                [then]
                                    [set_variable]
                                        name=target_unit_idx
                                        rand=0..$($all_eligible_units.length - 1)
                                    [/set_variable]
                                    [set_variable]
                                        name=rolled_xp
                                        rand=1..25
                                    [/set_variable]
                                    [modify_unit]
                                        [filter]
                                            id=$all_eligible_units[$target_unit_idx].id
                                        [/filter]
                                        experience="$($all_eligible_units[$target_unit_idx].experience + $rolled_xp)"
                                    [/modify_unit]
                                    [if]
                                        [variable]
                                            name=opt_enable_event_messages
                                            boolean_equals=yes
                                        [/variable]
                                        [then]
                                            [message]
                                                speaker=narrator
                                                message= _ "$all_eligible_units[$target_unit_idx].name gets a training montage. (+$rolled_xp XP)!"
                                            [/message]
                                        [/then]
                                    [/if]
                                [/then]
                            [/if]
                            [clear_variable]
                                name=all_eligible_units,target_unit_idx,rolled_xp
                            [/clear_variable]
                        [/case]

# Random event - Terrain Scramble
# ===============================

                        [case]
                            value="5"
                            [store_unit]
                                [filter]
                                [/filter]
                                variable=all_combat_units
                            [/store_unit]
                            [if]
                                [variable]
                                    name=all_combat_units.length
                                    greater_than=0
                                [/variable]
                                [then]
                                    [set_variable]
                                        name=random_target_idx
                                        rand=0..$($all_combat_units.length - 1)
                                    [/set_variable]
                                    [set_variable]
                                        name=center_x
                                        value=$all_combat_units[$random_target_idx].x
                                    [/set_variable]
                                    [set_variable]
                                        name=center_y
                                        value=$all_combat_units[$random_target_idx].y
                                    [/set_variable]
                                    [set_variable]
                                        name=terrain_pool
                                        value="Gs,Ds,Gg,Mm,Ss,Ww,Gll^Fp,Aa,Uu"
                                    [/set_variable]
                                    [set_variables]
                                        name=split_terrain_array
                                        [split]
                                            list=$terrain_pool
                                            key=value
                                            separator=","
                                        [/split]
                                    [/set_variables]
				    [store_locations]
                                        [and]
                                            x=$center_x
                                            y=$center_y
                                            radius=2
                                        [/and]
                                        [not]
                                            terrain="C*,K*,V*,*^C*,*^K*,*^V*"
                                        [/not]
                                        variable=target_hexes
                                    [/store_locations]
                                    [foreach]
                                        array=target_hexes
                                        [do]
                                            [set_variable]
                                                name=random_terrain_idx
                                                rand=0..$($split_terrain_array.length - 1)
                                            [/set_variable]
                                            [terrain]
                                                terrain=$split_terrain_array[$random_terrain_idx].value
                                                x=$this_item.x
                                                y=$this_item.y
                                            [/terrain]
                                        [/do]
                                    [/foreach]
                                    [if]
                                        [variable]
                                            name=opt_enable_event_messages
                                            boolean_equals=yes
                                        [/variable]
                                        [then]
                                            [message]
                                                speaker=narrator
                                                image="wesnoth-icon.png"
